spring:
  application:
    name: Deadlines API
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../deployment/generated/.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/deadlines}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: ${SPRING_JPA_FORMAT_SQL:true}
    show-sql: ${SPRING_JPA_SHOW_SQL:true}
  security:
    jwt:
      secret: ${JWT_SECRET:amt2bWZrbXZta21wYXNwZHZtYVtwc2Rudmpkb2JuYjBhW3Nkdm5kZnVwWzxvaXNkdm5ib3c5ZXVwaXV2bmhiZnk4czk=}
      access-expiration: ${JWT_ACCESS_EXPIRATION:10000}
      refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800}
  redis:
    hostname: ${REDIS_HOSTNAME:localhost}
    port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      properties:
        spring.json.add.type.headers: false

management:
  endpoints:
    access:
      default: none
    web:
      exposure:
        include: health
      discovery:
        enabled: false
  endpoint:
    health:
      access: read-only
      show-details: ${SHOW_HEALTH_DETAILS:never}

users:
  max-sessions: ${USERS_MAX_SESSIONS:50}
  max-linked-accounts-per-messenger: ${USERS_MAX_LINKED_ACCOUNTS_PER_MESSENGER:2}

outbox:
  batch-size: ${OUTBOX_BATCH_SIZE:200}
  max-retries: ${OUTBOX_MAX_RETRIES:5}

attachments:
  max-per-deadline: ${ATTACHMENTS_MAX_PER_DEADLINE:25}

deadlines:
  max-assignees: ${DEADLINES_MAX_ASSIGNEES:10}

storage:
  s3:
    endpoint: ${S3_ENDPOINT:http://localhost:3900}
    public-endpoint: ${S3_PUBLIC_ENDPOINT:${S3_ENDPOINT:http://localhost:3900}}
    region: ${S3_REGION:garage}
    bucket: ${S3_BUCKET:deadlines-attachments}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
    path-style-access-enabled: ${S3_PATH_STYLE_ACCESS_ENABLED:true}
    presigned-url-expiration: ${S3_PRESIGNED_URL_EXPIRATION:5m}

integration:
  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN:}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:false}
